server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's internal DNS. Using a variable makes nginx look the backend up on each request,
    # so it keeps working when the backend container restarts.
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Hashed build assets can be cached for a long time
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Single-page app: unknown paths (e.g. /exercise/xyz) fall back to index.html
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
